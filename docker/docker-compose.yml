services:
  postgres:
    image: postgres:16-alpine
    container_name: payments-postgres
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      # 5433 on the host: 5432 is taken by a local Postgres install.
      - "5433:5432"
    volumes:
      - payments-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

  mock-bank:
    build:
      context: ..
      dockerfile: docker/mock-bank.Dockerfile
    container_name: payments-mock-bank
    environment:
      MOCKBANK_ADDR: ":8081"
      # The API runs on the host, outside this Compose network.
      WEBHOOK_URL: "http://host.docker.internal:8080/v1/webhooks/mockbank"
      SETTLE_DELAY: "2s"
      MOCKBANK_WEBHOOK_SECRET: "${MOCKBANK_WEBHOOK_SECRET:?set MOCKBANK_WEBHOOK_SECRET in .env}"
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  kafka:
    image: apache/kafka:3.8.0
    container_name: payments-kafka
    ports:
      - "9092:9092"
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:9092
      interval: 2s

  kafka-init:
    image: apache/kafka:3.8.0
    network_mode: service:kafka
    depends_on:
      kafka:
        condition: service_healthy
    command: /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists --topic transfers --partitions 3

volumes:
  payments-pgdata:
